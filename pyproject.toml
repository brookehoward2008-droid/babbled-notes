[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "babbled-notes"
version = "0.1.0.dev0"
description = "A sound-first music tool powered by the Lilt text language and Gemma 4."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Babbled Notes contributors" }]
keywords = ["music", "dsl", "gemma", "audio", "midi", "accessibility"]

dependencies = [
  "mido>=1.3",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
gemini   = ["google-genai>=0.5"]
local    = ["transformers>=4.45", "torch>=2.2", "soundfile>=0.12"]
dsp      = ["librosa>=0.10", "numpy>=1.26"]
dev      = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
lilt = "lilt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lilt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
